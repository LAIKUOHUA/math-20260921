<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卡皮巴拉乘法小村</title>
  <style>
    :root{--ink:#49372b;--cream:#fff9ef;--paper:#fffdf8;--mint:#cfeee2;--green:#41967d;--coral:#f48b72;--gold:#f5c858;--line:#eadbc7;--shadow:0 12px 30px #7b54301c}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#fff8ea,#e9f7ef);min-height:100vh}button{font:inherit;cursor:pointer;border:0;color:var(--ink)}.app{max-width:1120px;margin:auto;padding:28px 22px 44px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:23px}.brand-badge{background:var(--coral);border-radius:15px;padding:8px 10px;font-size:25px;box-shadow:0 5px 0 #d76d59}.stars{background:#fff;border:2px solid var(--line);padding:10px 16px;border-radius:99px;font-weight:800;color:#9b711d}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:stretch}.card{background:var(--paper);border:2px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}.intro{padding:32px;position:relative;overflow:hidden}.eyebrow{color:var(--green);font-weight:900;letter-spacing:.08em;margin:0 0 10px}.intro h1{font-size:clamp(30px,4vw,48px);line-height:1.2;margin:0 0 12px}.intro p{font-size:17px;line-height:1.8;margin:0 0 22px;color:#725c49}.primary{background:var(--green);color:white;padding:14px 25px;border-radius:15px;font-weight:900;box-shadow:0 5px 0 #2e715f;transition:.15s}.primary:active,.answer:active{transform:translateY(3px);box-shadow:none}.intro .leaf{position:absolute;font-size:95px;right:-10px;bottom:-25px;opacity:.15}.pet-card{padding:25px;text-align:center;background:linear-gradient(#ccefe1,#fffaf1)}.pet-card h2{margin:3px 0 5px}.pet-card p{margin:0;color:#866e58}.pet-stage{height:185px;display:flex;align-items:center;justify-content:center;position:relative}.pet{font-size:112px;filter:drop-shadow(0 10px 4px #60432c22);transition:.3s}.accessory{position:absolute;font-size:48px;transform:translate(44px,-47px);transition:.3s}.ground{position:absolute;width:190px;height:25px;background:#9ed6b9;border-radius:50%;bottom:12px;z-index:0}.pet{z-index:1}.accessory{z-index:2}.section-title{display:flex;justify-content:space-between;align-items:end;margin:31px 2px 13px}.section-title h2{margin:0;font-size:24px}.hint{color:#886f58;font-size:14px}.levels{display:grid;grid-template-columns:repeat(10,1fr);gap:9px}.level{background:#fff;border:2px solid var(--line);border-radius:15px;padding:12px 3px;text-align:center;font-weight:900;color:#a48b73}.level span{display:block;font-size:21px;margin-bottom:5px}.level.done{background:#fff3cb;border-color:#f2c65b;color:#8d6715}.level.current{border-color:var(--green);color:var(--green);box-shadow:0 4px 0 var(--green)}.game{margin-top:27px;padding:28px;display:grid;grid-template-columns:1fr 1.05fr;gap:30px}.question-side{display:flex;flex-direction:column;justify-content:center;text-align:center}.tag{display:inline-block;background:#e3f5ed;color:#2f806b;font-weight:900;border-radius:99px;padding:7px 13px;margin:auto}.question{font-size:clamp(48px,7vw,78px);font-weight:900;margin:25px 0 10px;letter-spacing:.04em}.sub{color:#977d66;margin:0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-content:center}.answer{background:#fff8e8;border:2px solid #eed4a5;border-radius:18px;padding:19px;font-size:26px;font-weight:900;box-shadow:0 4px 0 #dfc18b;transition:.15s}.answer:hover{background:#fff0c5}.answer.correct{background:#bcebd6;border-color:#54ac8b;box-shadow:0 4px 0 #399070}.answer.wrong{background:#ffd2c5;border-color:#e8876c;animation:shake .25s}.feedback{min-height:30px;margin:18px 0 0;text-align:center;font-weight:900;font-size:18px}.feedback.good{color:#369071}.feedback.bad{color:#d56a50}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.reward{display:none;margin-top:20px;padding:25px;text-align:center;background:#fff3ce;border-color:#edc862}.reward.show{display:block}.reward h2{margin:0 0 7px}.reward .big{font-size:60px}.secondary{background:#fff;border:2px solid var(--line);padding:11px 18px;border-radius:12px;font-weight:800;margin-top:12px}.small{font-size:13px;color:#9b836d;margin-top:15px}@media(max-width:750px){.hero,.game{grid-template-columns:1fr}.levels{grid-template-columns:repeat(5,1fr)}.game{padding:22px;gap:15px}.topbar{align-items:flex-start}.brand{font-size:18px}.stars{font-size:14px;padding:8px 11px}.intro{padding:25px}}
    html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation;min-height:44px}.app{padding-top:calc(28px + env(safe-area-inset-top));padding-right:calc(22px + env(safe-area-inset-right));padding-bottom:calc(44px + env(safe-area-inset-bottom));padding-left:calc(22px + env(safe-area-inset-left))}@media(max-width:750px){.answer{min-height:64px;padding:16px;font-size:24px}.primary,.secondary{min-height:48px;padding:13px 22px}}@media(orientation:landscape) and (max-height:600px){.app{padding-top:14px}.pet-stage{height:120px}.intro h1{font-size:30px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><span class="brand-badge">🧮</span>卡皮巴拉乘法小村</div><div class="stars">⭐ <span id="starCount">0</span> 顆星</div></header>
  <section class="hero">
    <div class="card intro"><p class="eyebrow">WELCOME, 小小探險家！</p><h1>一起養出<br>最棒的卡皮巴拉</h1><p>完成乘法挑戰，幫卡皮巴拉收集美味水果、玩具和可愛裝扮吧！</p><button class="primary" id="startBtn">開始挑戰 →</button><span class="leaf">🌿</span></div>
    <div class="card pet-card"><h2>我的卡皮巴拉</h2><p id="petMood">準備好一起學習囉！</p><div class="pet-stage"><div class="ground"></div><div class="pet" id="pet">🦫</div><div class="accessory" id="accessory"></div></div><strong id="petName">小橘子</strong><div class="small">完成關卡就能解鎖新獎勵</div></div>
  </section>
  <div class="section-title"><h2>乘法冒險地圖</h2><span class="hint">共 10 個關卡</span></div>
  <div class="levels" id="levels"></div>
  <section class="card game" id="game">
    <div class="question-side"><span class="tag" id="levelTag">第 1 關・熱身草地</span><div class="question" id="question">準備好了嗎？</div><p class="sub" id="sub">點擊「開始挑戰」來回答第一題</p><div class="feedback" id="feedback"></div></div>
    <div class="answers" id="answers"></div>
  </section>
  <section class="card reward" id="reward"><div class="big" id="rewardIcon">🍎</div><h2 id="rewardTitle">太棒了！獲得新獎勵</h2><p id="rewardText"></p><button class="secondary" id="nextBtn">前往下一關 →</button></section>
</main>
<script>
const rewards=[['🍎','紅紅蘋果','小橘子最喜歡的點心！'],['🧸','迷你玩偶','一起午睡的好朋友。'],['🎩','探險帽','戴上就能勇敢闖關！'],['🛟','小泳圈','泡溫泉也要漂漂亮亮。'],['🌻','向日葵','把陽光帶回小村。'],['🎒','小背包','裝滿學習的小寶物。'],['🕶️','酷酷墨鏡','今天也是時尚達人。'],['🛁','溫泉澡盆','舒服泡澡的時光！'],['👑','小皇冠','你們是最棒的搭檔！'],['🏡','卡皮巴拉小屋','恭喜完成全部冒險！']];
let level=Number(localStorage.getItem('capyLevel')||0),stars=Number(localStorage.getItem('capyStars')||0),questionIndex=0,correct=0,currentAnswer=0;
const $=id=>document.getElementById(id); function save(){localStorage.setItem('capyLevel',level);localStorage.setItem('capyStars',stars)}
function renderLevels(){ $('starCount').textContent=stars; $('levels').innerHTML=Array.from({length:10},(_,i)=>`<div class="level ${i<level?'done':''} ${i===level?'current':''}"><span>${i<level?'✓':i===level?'🧭':'🔒'}</span>${i+1} 關</div>`).join('') }
function start(){if(level>=10){level=0;stars=0;save();renderLevels()} questionIndex=0;correct=0;$('reward').classList.remove('show');newQuestion();$('game').scrollIntoView({behavior:'smooth',block:'center'})}
function newQuestion(){let a=Math.min(9,Math.floor(level/2)+1+Math.floor(Math.random()*3)),b=1+Math.floor(Math.random()*9);currentAnswer=a*b;$('levelTag').textContent=`第 ${level+1} 關・${['熱身草地','水果森林','玩具工坊','帽子山丘','花朵小徑','背包溪谷','時尚沙灘','溫泉樂園','星星高原','夢想小屋'][level]}`;$('question').textContent=`${a} × ${b} = ?`;$('sub').textContent=`答對 ${correct}/3 題就能獲得獎勵`;$('feedback').textContent='';$('feedback').className='feedback';let opts=new Set([currentAnswer]);while(opts.size<4){let n=Math.max(1,currentAnswer+[-9,-5,3,6,9][Math.floor(Math.random()*5)]);opts.add(n)}$('answers').innerHTML=[...opts].sort(()=>Math.random()-.5).map(n=>`<button class="answer" data-value="${n}">${n}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b))}
function answer(btn){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(Number(btn.dataset.value)===currentAnswer){btn.classList.add('correct');correct++;stars++;$('feedback').textContent='答對了！卡皮巴拉開心地跳舞 💃';$('feedback').className='feedback good';if(correct>=3){setTimeout(win,550)}else setTimeout(newQuestion,650)}else{btn.classList.add('wrong');$('feedback').textContent='再想一下，乘法可以慢慢算喔！';$('feedback').className='feedback bad';setTimeout(()=>{document.querySelectorAll('.answer').forEach(b=>b.disabled=false);$('feedback').textContent='試試看其他答案～'},500)}save();$('starCount').textContent=stars}
function win(){let r=rewards[level];level++;save();renderLevels();$('rewardIcon').textContent=r[0];$('rewardTitle').textContent=`第 ${level} 關完成！`;$('rewardText').textContent=`你送給小橘子「${r[1]}」${r[2]}`;$('accessory').textContent=r[0];$('petMood').textContent=level===10?'全部冒險完成，太神奇了！':'謝謝你，我變得更可愛了！';$('reward').classList.add('show');$('question').textContent='🎉';$('sub').textContent='獎勵已放進卡皮巴拉的小屋！';$('answers').innerHTML=''}
$('startBtn').onclick=start;$('nextBtn').onclick=()=>level<10?start():start();renderLevels();
</script></body></html>
